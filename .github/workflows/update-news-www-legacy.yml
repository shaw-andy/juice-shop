name: "Update news on owasp.org/www-project-juice-shop (legacy)"

on:
  release:
    types: [ published ]

jobs:
  UpdateNewsOnWebsite:
    runs-on: ubuntu-latest
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      with:
        token: ${{ secrets.BOT_TOKEN }}
        repository: OWASP/www-project-juice-shop
        branch: master
    - name: Update tab_news.md
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
        PUBLISHED_AT: ${{ github.event.release.published_at }}
      run: |
        if ! [[ "$TAG_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "Refusing to publish news for unexpected release tag format" >&2
          exit 1
        fi
        export NEWS_ENTRY="* ${PUBLISHED_AT}: juice-shop [\`${TAG_NAME}\`](https://github.com/juice-shop/juice-shop/releases/tag/${TAG_NAME})"
        awk -v marker='<!-- next:juice-shop -->' '
          (i = index($0, marker)) { $0 = substr($0, 1, i + length(marker) - 1) "\n" ENVIRON["NEWS_ENTRY"] substr($0, i + length(marker)) }
          { print }
        ' tab_news.md > tab_news.md.tmp
        mv tab_news.md.tmp tab_news.md
    - uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 #v5.0.1
      with:
        commit_message: "Add juice-shop ${{ github.event.release.tag_name }} release notes to tab_news.md"
        branch: master
        commit_options: '--signoff'

        # Optional commit user and author settings
        commit_user_name: JuiceShopBot
        commit_user_email: 61591748+JuiceShopBot@users.noreply.github.com
        commit_author: JuiceShopBot <61591748+JuiceShopBot@users.noreply.github.com>
